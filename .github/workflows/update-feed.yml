name: Update Jazz TX feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build feed
        run: python scrape_jazztx.py --output docs/feed.xml --feed-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          git diff --cached --quiet || (git commit -m "Update feed" && git push)
